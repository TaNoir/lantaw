<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lantaw · Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400..800&family=Geist+Mono:wght@400..600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f4f0;
    --surface: #ffffff;
    --ink: #10222e;
    --muted: #5a707b;
    --faint: #66777f;
    --line: #e7e4dc;
    --line-2: #f0eee8;
    --night: #0e2a3a;
    --teal: #1f8a84;
    --teal-soft: #e3f2f0;
    --mango: #f4a940;
    --mango-text: #9a5c06;
    --mango-soft: #fcf0dc;
    --coral: #c9472f;
    --coral-soft: #fbe7e2;
    --violet-soft: #ecebf8;
    --violet: #5b55b0;
    --mono: 'Geist Mono', ui-monospace, monospace;
    --ease: cubic-bezier(0.16, 1, 0.3, 1);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 500 14px/1.45 'Manrope', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  ::selection { background: var(--mango-soft); }
  :focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; border-radius: 8px; }
  .num { font-family: var(--mono); font-feature-settings: 'tnum' 1, 'zero' 0; letter-spacing: -0.01em; }

  .app { display: grid; grid-template-columns: 236px 1fr; min-height: 100vh; }
  aside.side { position: sticky; top: 0; height: 100vh; padding: 20px 14px; display: flex; flex-direction: column; border-right: 1px solid var(--line); }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 16px; padding: 4px 10px 22px; letter-spacing: -0.01em; }
  .side nav a {
    display: flex; align-items: center; gap: 11px; padding: 9px 10px; border-radius: 10px;
    color: var(--muted); text-decoration: none; font-weight: 600; margin-bottom: 2px;
  }
  .side nav a:hover { color: var(--ink); background: rgba(16, 34, 46, 0.04); }
  .side nav a { border: 1px solid transparent; }
  .side nav a[aria-current] { color: var(--ink); background: var(--surface); border-color: var(--line); box-shadow: 0 1px 2px rgba(16,34,46,.06); }
  .side nav a .k { margin-left: auto; font: 500 11px var(--mono); color: var(--faint); }
  .side .foot { margin-top: auto; }
  .private { display: flex; gap: 10px; padding: 12px 10px; color: var(--muted); font-size: 12.5px; line-height: 1.4; border-top: 1px solid var(--line); margin-top: 8px; }
  .private svg { flex: none; margin-top: 1px; }

  main { padding: 28px 40px 48px; min-width: 0; }
  .head { display: flex; align-items: center; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
  .head h1 { margin: 0; font-size: 26px; font-weight: 750; letter-spacing: -0.025em; }
  .tag { font-size: 12px; font-weight: 600; color: var(--mango-text); background: var(--mango-soft); padding: 3px 9px; border-radius: 999px; }
  .head .tools { margin-left: auto; display: flex; gap: 10px; align-items: center; }
  .seg { display: flex; padding: 3px; background: #ebe9e3; border-radius: 10px; }
  .seg button { border: 0; background: transparent; font: 600 13px 'Manrope'; color: var(--muted); padding: 6px 12px; border-radius: 8px; cursor: pointer; }
  .seg button[aria-pressed='true'] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(16,34,46,.08); }
  .check { display: flex; align-items: center; gap: 8px; font-weight: 600; color: var(--muted); cursor: pointer; user-select: none; }
  .check input { accent-color: var(--teal); width: 16px; height: 16px; }
  .btn { display: inline-flex; align-items: center; gap: 6px; border: 0; background: var(--ink); color: #fff; font: 700 13px 'Manrope'; padding: 9px 14px; border-radius: 10px; cursor: pointer; }
  .btn:hover { background: #1c3747; }

  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; }
  .chart-card { padding: 20px 22px 14px; }
  .chart-top { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; flex-wrap: wrap; }
  .read .lbl { color: var(--muted); font-weight: 600; font-size: 13px; }
  .read .big { font: 500 38px/1.1 var(--mono); letter-spacing: -0.035em; margin-top: 4px; }
  .read .big .c { color: var(--faint); }
  .read .why { margin-top: 6px; color: var(--muted); font-size: 13px; }
  .read .why b { color: var(--ink); font-weight: 650; }
  .legend { display: flex; gap: 16px; color: var(--muted); font-size: 12.5px; font-weight: 600; }
  .legend i { display: inline-block; width: 18px; height: 0; border-top: 2px solid var(--teal); vertical-align: middle; margin-right: 6px; }
  .legend i.w { border-top: 2px dashed var(--violet); }
  .legend i.b { border-top: 1.5px dotted var(--coral); }
  .plot { position: relative; margin-top: 8px; }
  .plot svg { display: block; width: 100%; overflow: visible; }
  .plot .axis { font: 500 11px var(--mono); fill: var(--faint); }
  .tip {
    position: absolute; top: 56px; width: 236px; pointer-events: none;
    background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px;
    box-shadow: 0 12px 32px -12px rgba(16,34,46,.25), 0 2px 6px -2px rgba(16,34,46,.08);
    transition: left .12s var(--ease), opacity .2s;
  }
  .tip .d { font-weight: 700; font-size: 13px; }
  .tip .b { font: 500 13px var(--mono); color: var(--muted); margin-top: 1px; }
  .tip ul { list-style: none; margin: 10px 0 0; padding: 10px 0 0; border-top: 1px solid var(--line-2); }
  .tip li { display: flex; justify-content: space-between; gap: 10px; font-size: 12.5px; padding: 2px 0; }
  .tip li span:last-child { font-family: var(--mono); }
  .pos { color: var(--teal); }

  .grid2 { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: 20px; margin-top: 20px; }
  .card h2 { margin: 0; font-size: 15px; font-weight: 750; letter-spacing: -0.01em; }
  .card-h { display: flex; align-items: baseline; justify-content: space-between; padding: 18px 22px 12px; }
  .card-h a { color: var(--muted); font-size: 13px; font-weight: 600; text-decoration: none; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: right; font: 600 11.5px 'Manrope'; color: var(--faint); padding: 8px 22px 8px 0; border-bottom: 1px solid var(--line); }
  th:first-child, td:first-child { text-align: left; padding-left: 22px; }
  td { text-align: right; padding: 11px 22px 11px 0; border-bottom: 1px solid var(--line-2); font-family: var(--mono); font-size: 13px; }
  td:first-child { font-family: 'Manrope'; font-weight: 650; font-size: 13.5px; white-space: nowrap; }
  td .sub { display: block; font-weight: 500; color: var(--faint); font-size: 12px; }
  tr:last-child td { border-bottom: 0; }
  tr.on td { background: #fbfaf6; }
  tr.on td:first-child { color: var(--teal); }
  .low { display: inline-flex; align-items: center; gap: 8px; }
  .low .bar { width: 48px; height: 4px; border-radius: 4px; background: var(--line-2); overflow: hidden; }
  .low .bar span { display: block; height: 100%; border-radius: 4px; background: var(--teal); }
  .low.tight { color: var(--coral); }
  .low.tight .bar span { background: var(--coral); }

  .fl { list-style: none; margin: 0; padding: 0 22px 10px; }
  .fl li { display: grid; grid-template-columns: 34px 1fr auto; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line-2); }
  .fl li:last-child { border-bottom: 0; }
  .badge { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; }
  .fl .n { font-weight: 700; }
  .fl .s { color: var(--muted); font-size: 12.5px; }
  .prog { height: 5px; border-radius: 5px; background: var(--line-2); margin-top: 7px; overflow: hidden; }
  .prog span { display: block; height: 100%; background: var(--ink); border-radius: 5px; }
  .fl .amt { text-align: right; font: 500 13px var(--mono); }
  .fl .amt small { display: block; color: var(--faint); font: 500 11.5px 'Manrope'; }
  .fl li.whatif { opacity: 0.85; }
  .fl li.whatif .badge { border: 1.5px dashed var(--violet); }

  @media (max-width: 900px) {
    .app { grid-template-columns: 1fr; }
    aside.side { position: fixed; z-index: 9; top: auto; bottom: 0; left: 0; right: 0; height: auto; padding: 6px 8px calc(6px + env(safe-area-inset-bottom)); border: 0; border-top: 1px solid var(--line); background: rgba(245,244,240,.94); backdrop-filter: blur(12px); flex-direction: row; }
    .brand, .side .foot, .side nav a .k { display: none; }
    .side nav { display: flex; width: 100%; justify-content: space-around; }
    .side nav a { flex-direction: column; gap: 3px; font-size: 11px; padding: 6px 8px; margin: 0; }
    .side nav a[aria-current] { box-shadow: none; background: transparent; color: var(--teal); }
    main { padding: 16px 16px 96px; }
    .head h1 { font-size: 22px; }
    .head .tools { margin-left: 0; width: 100%; }
    .head .tools .btn span, .check { display: none; }
    .head .tools .btn { margin-left: auto; }
    .chart-card { padding: 16px 14px 10px; }
    .read .big { font-size: 32px; }
    .legend { display: none; }
    .grid2 { grid-template-columns: 1fr; }
    .hide-s { display: none; }
    .tip { display: none; }
  }
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><span id="logo"></span>Lantaw</div>
    <nav aria-label="Main" id="nav"></nav>
    <div class="foot">
      <nav><a href="#" id="settings"></a></nav>
      <div class="private"><span id="lock"></span><span>Stored only on this device. No account, no tracking.</span></div>
    </div>
  </aside>
  <main>
    <div class="head">
      <h1>Timeline</h1><span class="tag">Sample budget</span>
      <div class="tools">
        <div class="seg" role="group" aria-label="How far ahead"><button aria-pressed="false">6 mo</button><button aria-pressed="true">12 mo</button><button aria-pressed="false">24 mo</button></div>
        <label class="check"><input type="checkbox" id="wi"> Show what-ifs</label>
        <button class="btn" id="add"></button>
      </div>
    </div>

    <section class="card chart-card" aria-label="Balance forecast">
      <div class="chart-top">
        <div class="read" aria-live="polite">
          <div class="lbl" id="lbl"></div>
          <div class="big num" id="big"></div>
          <div class="why" id="why"></div>
        </div>
        <div class="legend"><span><i></i>Forecast</span><span><i class="w"></i>With what-ifs</span><span><i class="b"></i>Safety buffer</span></div>
      </div>
      <div class="plot" id="plot"><svg id="svg"></svg><div class="tip" id="tip"></div></div>
    </section>

    <div class="grid2">
      <section class="card" aria-label="Cutoffs">
        <div class="card-h"><h2>Cutoffs</h2><a href="#">All 24 cutoffs →</a></div>
        <table>
          <thead><tr><th>Payday to payday</th><th class="hide-s">Money in</th><th class="hide-s">Money out</th><th>Lowest</th><th>Ends with</th></tr></thead>
          <tbody id="cuts"></tbody>
        </table>
      </section>
      <section class="card" aria-label="Finish lines">
        <div class="card-h"><h2>Finish lines</h2><a href="#">Plans →</a></div>
        <ul class="fl" id="fl"></ul>
      </section>
    </div>
  </main>
</div>

<script src="sim.js"></script>
<script src="icons.js"></script>
<script>
  const L = LANTAW, days = L.days, N = days.length, $ = (id) => document.getElementById(id);
  $('logo').innerHTML = LOGO(28);
  $('lock').innerHTML = icon('lock', 16);
  $('add').innerHTML = icon('plus', 16) + '<span>Add item</span>';
  $('settings').innerHTML = icon('settings', 18) + 'Settings';
  $('nav').innerHTML = [['timeline', 'Timeline', 'T'], ['cutoffs', 'Cutoffs', 'C'], ['plans', 'Plans', 'P'], ['kaya', 'Kaya ba?', 'K'], ['items', 'Items', 'I']]
    .map(([ic, t, k], i) => `<a href="#" ${i ? '' : 'aria-current="page"'}>${icon(ic, 18)}${t}<span class="k">${k}</span></a>`).join('');

  const BUFFER = 3000;
  let idx = 0, showWI = false, geo;
  const find = (pred) => days.findIndex(pred);
  const atDate = (s) => find((d) => L.iso(d.date) === s);
  const firstEvent = (name, pred = () => true) => L.events.find((e) => e.name === name && pred(e));
  const lastOf = (name) => L.events.filter((e) => e.name === name).at(-1);
  const pins = [
    { e: firstEvent('13th month'), ic: 'gift', bg: 'var(--teal-soft)', fg: 'var(--teal)', t: '13th month' },
    { e: firstEvent('Pasko gifts'), ic: 'gift', bg: 'var(--mango-soft)', fg: 'var(--mango-text)', t: 'Pasko gifts' },
    { e: firstEvent('Tuition'), ic: 'book', bg: 'var(--mango-soft)', fg: 'var(--mango-text)', t: 'Tuition' },
    { e: { date: L.gipit.date }, ic: 'flag', bg: 'var(--coral-soft)', fg: 'var(--coral)', t: 'Gipit day' },
    { e: lastOf('SPayLater'), ic: 'check', bg: 'var(--violet-soft)', fg: 'var(--violet)', t: 'SPayLater done' },
    { e: firstEvent('Paluwagan payout'), ic: 'users', bg: 'var(--teal-soft)', fg: 'var(--teal)', t: 'Paluwagan payout' },
    { e: lastOf('Home Credit phone'), ic: 'check', bg: 'var(--violet-soft)', fg: 'var(--violet)', t: 'Home Credit done' },
  ];

  function draw() {
    const W = $('plot').clientWidth, small = W < 600;
    const H = small ? 260 : 350, padL = small ? 40 : 52, padT = small ? 72 : 76, padB = 26;
    const vals = days.map((d) => d.balance).concat(showWI ? days.map((d) => d.whatIf) : []);
    const lo = Math.min(0, ...vals), hi = Math.max(...vals) * 1.06;
    const x = (i) => padL + (i / (N - 1)) * (W - padL - 4);
    const y = (v) => padT + (1 - (v - lo) / (hi - lo)) * (H - padT - padB);
    geo = { x, y, W, H, padL };
    const step = (key) => days.map((d, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)} ${y(d[key]).toFixed(1)}`).join(' ');
    let grid = '';
    const tickStep = hi > 40000 ? 10000 : 5000;
    for (let v = Math.ceil(lo / tickStep) * tickStep; v <= hi; v += tickStep) {
      grid += `<line x1="${padL}" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="${v === 0 ? '#d9d5cb' : '#f0eee8'}"/>`;
      grid += `<text class="axis" x="${padL - 8}" y="${y(v) + 4}" text-anchor="end">${v === 0 ? '₱0' : (v < 0 ? '−' : '') + '₱' + Math.abs(v / 1000) + 'k'}</text>`;
    }
    let months = '';
    days.forEach((d, i) => {
      if (d.date.getUTCDate() !== 1) return;
      const m = d.date.getUTCMonth();
      if (small && m % 2) return;
      months += `<text class="axis" x="${x(i)}" y="${H - 6}" text-anchor="middle">${m === 0 ? 'Jan ’' + String(d.date.getUTCFullYear()).slice(2) : L.fmt(d.date, { month: 'short' })}</text>`;
    });
    let pinSvg = '';
    const pr = small ? 11 : 13;
    let lastX = -1e9, row = 0;
    pins.forEach((p, k) => {
      const i = find((d) => +d.date === +p.e.date);
      if (i < 0) return;
      const px = x(i), py = y(days[i].balance);
      row = px - lastX < pr * 2 + 6 ? 1 - row : 0; lastX = px;
      const top = (small ? 14 : 16) + row * (pr * 2 + 4) - (small ? 0 : 0);
      pinSvg += `<line x1="${px}" x2="${px}" y1="${top + pr}" y2="${py}" stroke="#c9c4b8" stroke-dasharray="2 3"/>
        <g transform="translate(${px - pr} ${top - pr + 0})"><title>${p.t} · ${L.short(p.e.date)}</title>
          <circle cx="${pr}" cy="${pr}" r="${pr}" fill="${p.bg}" stroke="#fff" stroke-width="2"/>
          <foreignObject x="${pr - 7}" y="${pr - 7}" width="14" height="14"><div xmlns="http://www.w3.org/1999/xhtml" style="color:${p.fg};line-height:0">${icon(p.ic, 14)}</div></foreignObject>
        </g>
        <circle cx="${px}" cy="${py}" r="3" fill="#fff" stroke="${p.fg}" stroke-width="1.5"/>`;
    });
    const area = step('balance') + ` L${x(N - 1)} ${y(lo)} L${x(0)} ${y(lo)} Z`;
    $('svg').setAttribute('viewBox', `0 0 ${W} ${H}`);
    $('svg').setAttribute('height', H);
    $('svg').innerHTML = `
      <defs><linearGradient id="ar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1f8a84" stop-opacity=".16"/><stop offset="1" stop-color="#1f8a84" stop-opacity="0"/></linearGradient></defs>
      ${grid}${months}
      <path d="${area}" fill="url(#ar)"/>
      ${showWI ? `<path d="${step('whatIf')}" fill="none" stroke="#5b55b0" stroke-width="1.5" stroke-dasharray="5 4"/>` : ''}
      <line x1="${padL}" x2="${W}" y1="${y(BUFFER)}" y2="${y(BUFFER)}" stroke="#c9472f" stroke-width="1.25" stroke-dasharray="1.5 4" stroke-linecap="round"/>
      <path d="${step('balance')}" fill="none" stroke="#1f8a84" stroke-width="1.6" stroke-linejoin="round"/>
      ${pinSvg}
      <line id="cur" y1="${padT - 8}" y2="${H - padB}" stroke="#10222e" stroke-opacity=".5"/>
      <circle id="cdot" r="5" fill="#10222e" stroke="#fff" stroke-width="2"/>
      <rect id="hit" x="${padL}" y="0" width="${W - padL}" height="${H}" fill="transparent" style="cursor:crosshair"/>`;
    const hit = $('hit');
    const move = (e) => { const r = $('svg').getBoundingClientRect(); idx = Math.max(0, Math.min(N - 1, Math.round(((e.clientX - r.left - padL) / (W - padL - 4)) * (N - 1)))); update(true); };
    hit.addEventListener('pointermove', move);
    hit.addEventListener('pointerdown', move);
    hit.addEventListener('pointerleave', () => { $('tip').style.opacity = 0; });
    update(false);
  }

  function sub(e) {
    if (e.movedFrom) return `moved from ${L.fmt(e.movedFrom, { weekday: 'short' })}`;
    if (e.k) return `${e.k} of ${e.n}`;
    return e.from ? e.from : '';
  }

  function update(hover) {
    const p = days[idx];
    $('cur').setAttribute('x1', geo.x(idx)); $('cur').setAttribute('x2', geo.x(idx));
    $('cdot').setAttribute('cx', geo.x(idx)); $('cdot').setAttribute('cy', geo.y(p.balance));
    $('lbl').textContent = idx === 0 ? `Balance today · ${L.fmt(p.date, { weekday: 'short', month: 'short', day: 'numeric' })}` : `Balance on ${L.fmt(p.date, { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' })}`;
    const [w, c] = p.balance.toFixed(2).split('.');
    $('big').innerHTML = `₱${Number(w).toLocaleString('en-PH')}<span class="c">.${c}</span>`;
    const cut = L.cutoffs.find((c) => p.date >= c.start && p.date <= c.end);
    $('why').innerHTML = `Lowest before next sweldo: <b class="num">${L.peso(cut.low.balance)}</b> on ${L.short(cut.low.date)} · Gipit day <b class="num">${L.peso(L.gipit.balance)}</b> on ${L.short(L.gipit.date)}`;
    const tip = $('tip');
    if (hover) {
      const left = geo.x(idx) + 16 + 236 > geo.W ? geo.x(idx) - 252 : geo.x(idx) + 16;
      tip.style.left = left + 'px'; tip.style.opacity = 1;
      tip.innerHTML = `<div class="d">${L.fmt(p.date, { weekday: 'long', month: 'short', day: 'numeric', year: 'numeric' })}</div><div class="b">${L.peso(p.balance)}</div>` +
        (p.events.length ? `<ul>${p.events.slice(0, 5).map((e) => `<li><span>${e.name}</span><span class="${e.amount > 0 ? 'pos' : ''}">${L.peso(e.amount, { sign: true })}</span></li>`).join('')}</ul>` : '');
    } else tip.style.opacity = 0;
    document.querySelectorAll('#cuts tr').forEach((tr) => tr.classList.toggle('on', tr.dataset.s === L.iso(cut.start)));
  }

  const range = (a, b) => a.getUTCMonth() === b.getUTCMonth() ? `${L.short(a)}–${b.getUTCDate()}` : `${L.short(a)} – ${L.short(b)}`;
  $('cuts').innerHTML = L.cutoffs.slice(0, 8).map((c) => {
    const inn = c.events.filter((e) => e.amount > 0).reduce((s, e) => s + e.amount, 0);
    const out = c.events.filter((e) => e.amount < 0).reduce((s, e) => s + e.amount, 0);
    const tight = c.low.balance < BUFFER * 2;
    const w = Math.max(4, Math.min(100, (c.low.balance / 20000) * 100));
    return `<tr data-s="${L.iso(c.start)}"><td>${range(c.start, c.end)}<span class="sub">${c.events.length} items</span></td>
      <td class="hide-s pos">${L.peso(inn, { sign: true })}</td><td class="hide-s">${L.peso(out)}</td>
      <td><span class="low ${tight ? 'tight' : ''}"><span class="bar"><span style="width:${w}%"></span></span>${L.peso(c.low.balance)}</span></td>
      <td>${L.peso(c.endBal)}</td></tr>`;
  }).join('');

  const hc = L.events.filter((e) => e.name === 'Home Credit phone');
  const sp = L.events.filter((e) => e.name === 'SPayLater');
  const pal = L.events.filter((e) => e.kind === 'paluwagan');
  const fin = [
    { ic: 'card', bg: 'var(--violet-soft)', fg: 'var(--violet)', n: 'SPayLater', k: sp[0].k - 1, t: 6, s: `done ${L.short(sp.at(-1).date)}, ${sp.at(-1).date.getUTCFullYear()}`, a: '₱1,250', u: 'monthly' },
    { ic: 'card', bg: 'var(--violet-soft)', fg: 'var(--violet)', n: 'Home Credit phone', k: hc[0].k - 1, t: 12, s: `done ${L.short(hc.at(-1).date)}, ${hc.at(-1).date.getUTCFullYear()}`, a: '₱2,083', u: 'monthly' },
    { ic: 'users', bg: 'var(--teal-soft)', fg: 'var(--teal)', n: 'Paluwagan', k: pal[0].k - 1, t: 10, s: `your turn ${L.short(pal.at(-1).date)} · <span style="white-space:nowrap">+₱9,000</span>`, a: '₱1,000', u: 'monthly' },
  ];
  $('fl').innerHTML = fin.map((f) => `<li><span class="badge" style="background:${f.bg};color:${f.fg}">${icon(f.ic, 17)}</span>
      <div><div class="n">${f.n}</div><div class="s">${f.k} of ${f.t} paid · ${f.s}</div><div class="prog"><span style="width:${(f.k / f.t) * 100}%"></span></div></div>
      <div class="amt">${f.a}<small>${f.u}</small></div></li>`).join('') +
    `<li class="whatif"><span class="badge" style="color:var(--violet)">${icon('card', 17)}</span><div><div class="n">BPI 0% laptop</div><div class="s">What-if · 12 × ₱3,249 from Jan 3 · not in your forecast</div></div><div class="amt">₱3,249<small>monthly</small></div></li>`;

  $('wi').onchange = (e) => { showWI = e.target.checked; draw(); };
  new ResizeObserver(draw).observe($('plot'));
</script>
