[package]
name = "lantaw-engine"
version = "0.1.0"
edition = "2021"

[lib]
# cdylib is what wasm-bindgen turns into a .wasm file; rlib lets `cargo test` link the crate.
crate-type = ["cdylib", "rlib"]

[dependencies]
rust_decimal = { version = "1.43", features = ["serde-str"] }
chrono = { version = "0.4.45", default-features = false, features = ["serde", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2.130"
serde-wasm-bindgen = "0.6.5"
# default-features = false keeps getrandom out of the build: JS supplies all randomness.
argon2 = { version = "0.6", default-features = false, features = ["alloc"] }
aes-gcm = { version = "0.11", default-features = false, features = ["aes", "alloc"] }

[dev-dependencies]
rust_decimal_macros = "1.40"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
